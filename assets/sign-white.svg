    <polygon points="5.474,12.100 9.022,12.100 10.200,3.000 8.900,3.000"/>
    <polygon points="2.500,20.000 8.000,20.000 8.880,13.200 5.060,13.200"/>
    <polygon points="12.978,12.100 16.526,12.100 13.100,3.000 11.800,3.000"/>
    <polygon points="14.000,20.000 19.500,20.000 16.940,13.200 13.120,13.200"/>
    <rect x="1.5" y="9.9" width="19" height="2.2"/>
  </g>
</svg>
