[package]
name = "autobahn"
version = "0.1.0"
edition = "2021"
description = "Fast, safe, SSH-focused bidirectional file synchronization"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
notify = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
