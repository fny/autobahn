[package]
name = "benchharness"
version = "0.1.0"
edition = "2021"
description = "The measurement plane of the autobahn/mutagen benchmark: one static binary so both hosts run byte-identical instruments."

[[bin]]
name = "benchmark"
path = "src/main.rs"

[dependencies]
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
