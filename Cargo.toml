[package]
name = "autobahn"
version = "0.4.0"
edition = "2021"
description = "Fast, safe, SSH-focused bidirectional file synchronization"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
notify = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"

# The menu bar app, behind a feature so the agent build stays lean.
tray-icon = { version = "0.24", optional = true }
muda = { version = "0.19", optional = true }
winit = { version = "0.30", optional = true }
notify-rust = { version = "4", optional = true }
# The menu bar's ink, for the tray icon: the sign is drawn in the bar's
# own black or white, which a template image cannot do once a coloured
# dot is part of it — read from the status item's own button, whose
# appearance is the menu bar's. Versions already in the tree through
# tray-icon, so its NSStatusItem is the same type as ours.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSAppearance", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView"] }
toml_edit = "0.25.15"

[features]
tray = ["dep:tray-icon", "dep:muda", "dep:winit", "dep:notify-rust", "dep:objc2", "dep:objc2-app-kit"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true

# The binaries that ship: release, compiled as one unit. It answered a
# remote-side edit at 420k files 10% faster (221 → 198 ms) and takes 40%
# longer to build (85 → 120 s), so it is kept out of the release profile
# that tests and development builds use.
[profile.dist]
inherits = "release"
codegen-units = 1

# musl's allocator is slow and takes a global lock: a remote-side edit at
# 420k files took 264 ms with it, 208 with mimalloc, 164 on glibc. The
# static Linux release binaries are musl, so they get mimalloc — on x86_64
# for now: its C needs a musl C compiler, which Ubuntu packages
# (musl-tools) for x86_64 and not for aarch64.
[target.'cfg(all(target_env = "musl", target_arch = "x86_64"))'.dependencies]
mimalloc = { version = "0.1", default-features = false }
