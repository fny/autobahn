# What the window and the menu bar say, in English.
#
# One table per surface, one key per line. A line may carry {name}
# placeholders, which the code fills in; everything else here is read
# exactly as written. Nothing translates this yet — but a second
# language is now a second file rather than a rewrite.

[app]
name = "autobahn"
window = "Autobahn Desk"
surface = "desk"

[pane]
groups = "Groups"
conflicts = "Conflicts"
conflicts_about = "issues needing resolution"
config = "Configuration"
config_about = "the file, as the parser reads it"
log = "Log"
log_about = "supervisor's event stream"
hosts = "Hosts"
hosts_about = "machines on the fleet"
counted = "{groups} · {sessions} · {about}"
counted_bare = "{groups} · {sessions}"
group_one = "1 group"
group_many = "{count} groups"
session_one = "1 session"
session_many = "{count} sessions"

[fleet]
