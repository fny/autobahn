[tip]
copy = "Click to copy this line"
flush = "Wake this session for a cycle now, rather than waiting for its interval."
verify = "Re-read every file's content on the next cycle, so a change made without the metadata moving is seen."
pause = "Suspend cycling for this session. Nothing is forgotten; it picks up where it left off."
resume = "Start cycling again after a pause."
keep_alpha = "Keep this machine's version and copy it over the other side."
keep_beta = "Keep the other side's version and copy it here."
keep_both = "Keep both versions: the other side's is kept beside this one under a suffixed name."
show_difference = "Run autobahn diff and show what it prints."
reveal = "Show this file in the Finder."
log_re_read = "Read the last 400 lines of the log again."
log_tail = "Follow the log as it is written, staying at the last line."
save = "Write the held changes. The supervisor re-reads the file within a few seconds and restarts only the sessions whose plan changed."
revert = "Throw the held changes away and go back to the file on disk."
config_re_read = "Read the file again, in case it was edited elsewhere."
unset = "Take this key out of the file, so the default is used again."
list = "Click to edit these as text, one to a line"
line = "Click to type a value. Enter keeps it, Escape leaves it."
keep_value = "Keep this value. Command-Enter does the same."
leave_value = "Leave the value as it was. Escape does the same."
