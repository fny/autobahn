# Manual-trigger CI: both jobs run only when asked (workflow_dispatch),
# because the repository is private and macOS runner minutes bill at ten
# times the Linux rate. Trigger with:
#   gh workflow run ci.yml
name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release
