# The bottom of the window when it has nothing else to say. One is
# picked at random, so adding a line here is adding a hint.
[hints]
json = "every number here came from `autobahn status --json` — so can yours"
shop = "there is a terminal version of all this: `autobahn mi`"
issues = "`autobahn issues` lists everything waiting, with the command that clears each one"
diff = "`autobahn diff <path>` shows the two sides of a conflicted file"
doctor = "`autobahn doctor <group>` says what the next cycle would do, without doing it"
log = "the log searches with ⌃F, and follows the file with Tail"
wordmark = "five clicks on the wordmark show the experimental settings"
save = "nothing is written here that the supervisor would refuse to load"
copy = "a path, a version or a complaint can be selected and copied"
reset = "`autobahn reset <group>` merges both sides again, deletions and all"
