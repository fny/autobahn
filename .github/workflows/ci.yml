# CI on every push to main and every pull request — except changes that
# cannot affect a build or its tests: prose, the docs, benchmark reports,
# README artwork, and the release workflow (which only runs on tags, and is
# not something this workflow could exercise). Also runnable by hand:
#   gh workflow run ci.yml
#
# macOS runners are the scarce ones: slower to start, and a free account
# runs only a handful at a time. So there is exactly one macOS job, on the
# same image the release uses, running the suite and building the app on
# one runner and one cache. It starts only after the Linux job passes —
# a change that fails formatting, lints or tests there is broken anyway —
# and a newer push cancels an older run of the same branch before it
# spends a runner on stale code. For a change that cannot touch macOS,
# put [skip mac] in the head commit's message (or a pull request's title)
# and the macOS job is skipped; everything else still runs.
#
# A release requires every job here — linux, linux-arm, mac and spec — to
# have succeeded on the tagged commit (release.yml's version job), so
# renaming one means changing that list too. For a commit CI skipped:
#   gh workflow run ci.yml --ref <tag>
name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bench/**'
      - 'LICENSE*'
      - 'assets/sign*'
      - '.github/workflows/release.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'bench/**'
      - 'LICENSE*'
      - 'assets/sign*'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Read-only, whatever the repository's default says: nothing here writes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --locked

  spec:
    # The specification, checked at its quick bound, and the implementation
    # replayed against it: the real reconciler and the real fence play the
    # spec's games, and every game must be a behavior TLC accepts. The full
    # bounds take hours on a runner; those are spec-full.yml, by hand.
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: check.sh fails when TLC fails
        run: spec/check-test.sh
      - name: TLC, the release spec/tla2tools.version pins
        # Fetched and checked against the pinned SHA-256; the log names it.
        run: spec/check.sh --fetch
      - name: The star spec, quick bound
        run: spec/check.sh quick
      - name: The implementation against the spec
        run: AUTOBAHN_TLC=1 cargo test --release --locked --test spec_replay --test spec_peering_replay

  mac:
    # A job with `needs` runs only if what it needs succeeded, and that
    # still holds with an `if` of its own: this adds the skip marker to it.
    needs: linux
    if: >-
      ${{ !contains(github.event.head_commit.message, '[skip mac]')
          && !contains(github.event.pull_request.title, '[skip mac]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      # Caches target/, which holds both the plain build and target/tray.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Use Xcode 26 if the runner has it
        # Only Xcode 26's actool compiles the Icon Composer bundle; without
        # it build.sh falls back to the committed .icns, and this says which.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Tests
        run: cargo test --release --locked
      - name: Build the app
        # Signed ad-hoc: this job holds no certificate and needs none to
        # prove the app still compiles, bundles its icon, and signs. Real
        # signing belongs to the release, behind approval.
        run: apps/macos/build.sh
      - name: Check the bundle
        run: |
          APP=apps/macos/Autobahn.app
          codesign --verify --strict "$APP"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Contents/Info.plist"
          ls "$APP/Contents/Resources"

  # Linux on ARM: the deployment target for Graviton instances. The code
  # needs no platform-specific anything here — this job exists to keep that
  # true rather than to assume it.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Tests
        run: cargo test --release --locked
