# Builds every supported platform on a version tag and publishes a release
# whose assets follow the agent bundle's naming (autobahn-<os>-<arch>), so a
# downloaded set doubles as an agents directory for cross-platform
# controllers. Linux binaries are static musl (no libc version constraints);
# macOS binaries link only the always-present libSystem.
#
# The macOS side — both command-line binaries, and the menu bar app as
# Autobahn-macos-aarch64.zip — is signed with the Developer ID certificate
# and notarised by Apple, so a copy downloaded in a browser is not refused
# by Gatekeeper. It is built in one job, the only one holding the
# certificate, inside the protected "release" environment, which waits for
# approval before any secret reaches a runner. docs/macos-app.md lists what
# that environment must contain.
name: Release

on:
  push:
    tags: ["v*"]

# Read-only for every job, whatever the repository's default says. Only
# the release job, the last, which holds no signing secret and runs no
# build, can write: it publishes the release.
permissions:
  contents: read

jobs:
  # The tag is what names the agent on every remote host: the controller
  # runs ~/.autobahn/bin/autobahn-<package version>+e<epoch> and uploads an
  # agent only when that path is missing. A tag that disagrees with
  # Cargo.toml therefore publishes binaries whose agents are named for a
  # different version than the release everybody quotes, and no handshake
  # ever catches it because both ends of a session agree with each other.
  # Nothing checked this before, so it is checked here, before a runner
  # spends half an hour building the wrong thing.
  #
  # Nor did anything require the tagged commit to have been tested: CI
  # skips doc-only commits and, on request, the macOS job, and a red run
  # never stopped anyone pushing a tag. So this job also requires every
  # CI job to have succeeded on that very commit, in some run of ci.yml.
  # It asks the Actions API, not the check runs, because this workflow's
  # own jobs are called linux and mac too.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The tag must match the package version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$package" ]; then
            echo "tag $GITHUB_REF_NAME is version '$tag'," \
                 "but Cargo.toml says '$package'." >&2
            echo "The package version names the agent on every remote host." \
                 "Fix one of them and tag again." >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches Cargo.toml ($package)"
      - name: CI must have passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          runs=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&per_page=100" \
            --jq '.workflow_runs[].id') || exit 1
          # The jobs that succeeded in the latest attempt of each run.
          passed=$(for run in $runs; do
            gh api --paginate \
              "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs?filter=latest&per_page=100" \
              --jq '.jobs[] | select(.conclusion == "success") | .name' || exit 1
          done) || exit 1
          missing=
          for job in linux linux-arm mac spec; do
            printf '%s\n' "$passed" | grep -qx -- "$job" || missing="$missing $job"
          done
          if [ -n "$missing" ]; then
            echo "CI has not passed on $sha, the commit $GITHUB_REF_NAME names:" \
                 "no successful run of$missing." >&2
            echo "Run CI on it with: gh workflow run ci.yml --ref $GITHUB_REF_NAME" >&2
            echo "and, once it is green, re-run this workflow or push the tag again." >&2
            exit 1
          fi
          echo "CI passed on $sha: linux, linux-arm, mac and spec"

  linux:
    needs: version
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux-x86_64
          - target: aarch64-unknown-linux-musl
            platform: linux-aarch64
            linker: aarch64-linux-gnu-gcc
            packages: gcc-aarch64-linux-gnu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust
        # rustup is on every hosted runner; no third-party action runs here.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET"
          rustup default stable
      - name: Install cross toolchain
        if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - name: Configure cross linker
        if: matrix.linker
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/config.toml <<EOF
          [target.${{ matrix.target }}]
          linker = "${{ matrix.linker }}"
          EOF
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Stage artifact
        run: cp target/${{ matrix.target }}/release/autobahn autobahn-${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: autobahn-${{ matrix.platform }}
          path: autobahn-${{ matrix.platform }}
          if-no-files-found: error

  mac:
    # Both command-line binaries and the menu bar app, each signed with the
    # Developer ID certificate and notarised by Apple. The curl installer
    # never quarantines anything; a copy downloaded by hand is quarantined,
    # and Gatekeeper refuses a quarantined executable it cannot attribute.
    # Secrets reach this job only after approval, and never reach pull
    # requests from forks.
    needs: version
    runs-on: macos-15
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Rust
        # rustup is on every hosted runner; no third-party action runs in
        # the job that holds the signing secrets.
        run: |
          rustup toolchain install stable --profile minimal \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          rustup default stable
      - name: Use Xcode 26 if the runner has it
        # Only Xcode 26's actool compiles the Icon Composer bundle. Without
        # it, build.sh falls back to the committed .icns: still the real
        # icon, only without the macOS 26 variants.
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
      - name: Build the command-line binaries
        run: |
          for pair in aarch64-apple-darwin:darwin-aarch64 x86_64-apple-darwin:darwin-x86_64; do
            target=${pair%%:*}; platform=${pair##*:}
            cargo build --release --locked --target "$target"
            cp "target/$target/release/autobahn" "autobahn-$platform"
          done
      - name: Build the app, unsigned
        # Every build happens before the certificate exists: a dependency's
        # build script or proc macro that runs while the identity is usable
        # could sign anything as us. Nothing after the import compiles.
        run: apps/macos/build.sh --unsigned
      - name: The app must report the tag's version
        # build.sh writes both keys from Cargo.toml, which the version job
        # has already matched to the tag; this checks what actually ships.
        run: |
          plist=apps/macos/Autobahn.app/Contents/Info.plist
          for key in CFBundleShortVersionString CFBundleVersion; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")
            if [ "$value" != "${GITHUB_REF_NAME#v}" ]; then
              echo "the app's $key is '$value', but the tag is $GITHUB_REF_NAME" >&2
              exit 1
            fi
          done
          echo "the app reports ${GITHUB_REF_NAME#v}"
      - name: Import the Developer ID certificate
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          # A throwaway keychain with a random password, added to the search
          # list so codesign and security find the identity in it.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Write the notary key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_API_KEY }}
        run: printf '%s' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
      - name: Sign and notarise the command-line binaries
        env:
          AUTOBAHN_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          AUTOBAHN_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          AUTOBAHN_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
        run: apps/macos/notarize-cli.sh autobahn-darwin-aarch64 autobahn-darwin-x86_64
      - name: Sign, notarise and staple the app
        # --sign-only compiles nothing: it signs the bundle built above.
        env:
          AUTOBAHN_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          AUTOBAHN_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          AUTOBAHN_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER_ID }}
          AUTOBAHN_RELEASE_ZIP: Autobahn-macos-aarch64.zip
        run: apps/macos/release.sh --sign-only apps/macos/Autobahn.app
      - name: Remove the credentials
        # Whether the build passed or failed. The runner is discarded after
        # the job anyway; this is so nothing outlives the step that needed it.
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/certificate.p12"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mac
          path: |
            autobahn-darwin-aarch64
            autobahn-darwin-x86_64
            Autobahn-macos-aarch64.zip
          if-no-files-found: error

  release:
    needs: [linux, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only for the epoch, which the manifest states beside the version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          path: source
          sparse-checkout: src/protocol.rs
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          merge-multiple: true
      - name: Assemble the agents bundle and checksums
        # The agents bundle takes the lower-case autobahn-* binaries, which
        # now include the signed macOS ones; the app archive is Autobahn-*.
        #
        # The MANIFEST names the build of every binary in it — version,
        # epoch, and blake3 — so a controller refuses to upload a stale
        # bundle before it reaches any host, rather than having every host
        # refuse it at the handshake (src/transport/install.rs). Hashed
        # here, after signing, because signing changes the bytes.
        run: |
          epoch=$(sed -n 's/^pub const COMPATIBILITY_EPOCH: u32 = \([0-9]*\);/\1/p' source/src/protocol.rs)
          test -n "$epoch" || { echo "no COMPATIBILITY_EPOCH in src/protocol.rs" >&2; exit 1; }
          version="${GITHUB_REF_NAME#v}+e${epoch}"
          python3 -m pip install --quiet blake3
          mkdir agents
          cp autobahn-* agents/
          python3 - "$version" <<'PY'
          import blake3, os, sys
          version = sys.argv[1]
          names = sorted(n for n in os.listdir("agents") if n.startswith("autobahn-"))
          with open("agents/MANIFEST", "w") as manifest:
              for name in names:
                  with open(os.path.join("agents", name), "rb") as binary:
                      digest = blake3.blake3(binary.read()).hexdigest()
                  manifest.write(f"{name} {version} {digest}\n")
          PY
          cat agents/MANIFEST
          tar czf autobahn-agents.tar.gz agents
          sha256sum autobahn-* Autobahn-macos-aarch64.zip > SHA256SUMS
      - name: Publish release
        # A tag with a hyphen in it is a prerelease, which is what
        # semantic versioning means by v0.5.0-dev.1. Marking it as one
        # keeps GitHub's "latest" pointing at the last stable release, and
        # "latest" is what scripts/install.sh and `autobahn update` both
        # resolve when no tag is asked for. Without the mark, publishing a
        # dev build would install it on every machine that ran the
        # installer that day. Testers opt in by tag instead.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$GITHUB_REF_NAME" in
            *-*) prerelease=--prerelease ;;
            *)   prerelease= ;;
          esac
          gh release create "$GITHUB_REF_NAME" $prerelease \
            --repo "$GITHUB_REPOSITORY" \
            --title "autobahn $GITHUB_REF_NAME" \
            --generate-notes \
            autobahn-linux-x86_64 \
            autobahn-linux-aarch64 \
            autobahn-darwin-aarch64 \
            autobahn-darwin-x86_64 \
            autobahn-agents.tar.gz \
            Autobahn-macos-aarch64.zip \
            SHA256SUMS
