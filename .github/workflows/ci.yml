# Manual-trigger CI: both jobs run only when asked (workflow_dispatch),
# because the repository is private and macOS runner minutes bill at ten
# times the Linux rate. Trigger with:
#   gh workflow run ci.yml
name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --release --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release

  mac:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release

  # Linux on ARM: the deployment target for Graviton instances. The code
  # needs no platform-specific anything here — this job exists to keep that
  # true rather than to assume it.
  linux-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release

  # FreeBSD has no hosted runner, so the suite runs inside a FreeBSD VM on
  # the Linux runner. (A container cannot do this: containers share the
  # host kernel, and FreeBSD's kqueue watcher needs a FreeBSD kernel.)
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Tests in a FreeBSD VM
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          prepare: |
            pkg install -y rust
          run: |
            cargo test --release
