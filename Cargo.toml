[package]
name = "autobahn"
version = "0.4.0"
edition = "2021"
description = "Fast, safe, SSH-focused bidirectional file synchronization"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = { version = "2", default-features = false, features = ["std", "serde"] }
blake3 = "1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
notify = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"

# The menu bar app, behind a feature so the agent build stays lean.
tray-icon = { version = "0.24", optional = true }
muda = { version = "0.20", optional = true }
winit = { version = "0.30", optional = true }
notify-rust = { version = "4", optional = true }
toml_edit = "0.25.15"
minisign-verify = "0.3"
image = { version = "0.25.10", default-features = false, features = ["png"], optional = true }
schemars = { version = "1", optional = true }
# The other window: the same fleet drawn with GPUI Kit, which brings
# its own GPUI. Kept behind its own feature and its own binary, so the
# two never meet in one process.
gpui-kit = { version = "0.6", optional = true }

# The menu bar's ink, for the tray icon: the sign is drawn in the bar's
# own black or white, which a template image cannot do once a coloured
# dot is part of it — read from the status item's own button, whose
# appearance is the menu bar's. Versions already in the tree through
# tray-icon, so its NSStatusItem is the same type as ours. macOS only:
# objc2 refuses to compile anywhere else, and the tray builds on Linux.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSAppearance", "NSResponder", "NSStatusItem", "NSStatusBarButton", "NSButton", "NSControl", "NSView", "NSDockTile"] }
# Notifications the system itself posts, rather than the deprecated path
# notify-rust reaches for: grouped under the app, replaced by identifier
# rather than stacked, and drawn the way every other notification is.
# Only a bundled app may use it, which is checked before it is asked.
objc2-user-notifications = { version = "0.3", optional = true, default-features = false, features = ["std", "UNUserNotificationCenter", "UNNotificationRequest", "UNNotificationContent", "UNNotificationTrigger", "UNNotificationSound", "block2"] }
block2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, default-features = false, features = ["std", "NSBundle", "NSString", "NSError", "NSDictionary"] }

# Neither GPUI nor winit starts GTK for the menu bar. Name the version
# muda already uses, on the same targets, so the bar can start it itself.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gtk = { version = "0.18", optional = true }

[features]
tray = ["dep:tray-icon", "dep:muda", "dep:winit", "dep:notify-rust", "dep:gtk", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-user-notifications", "dep:block2", "dep:objc2-foundation"]
# The configuration's own shape, for anything that builds a form from it.
schema = ["dep:schemars"]
# The dash: a window over the fleet, personal and unshipped. Its own
# binary, autobahn-dash, bundled by apps/dash/build.sh.
dash = ["dep:gpui-kit", "dep:image", "schema", "dep:tray-icon", "dep:muda", "dep:notify-rust", "dep:gtk", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-user-notifications", "dep:block2", "dep:objc2-foundation"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true

# The binaries that ship: release, compiled as one unit. It answered a
# remote-side edit at 420k files 10% faster (221 → 198 ms) and takes 40%
# longer to build (85 → 120 s), so it is kept out of the release profile
# that tests and development builds use.
[profile.dist]
inherits = "release"
codegen-units = 1

# musl's allocator is slow and takes a global lock: a remote-side edit at
# 420k files took 264 ms with it on x86_64, 208 with mimalloc (164 on
# glibc); at 400k on Graviton, 190 against 130. The static Linux release
# binaries are musl, so they get mimalloc. Its C needs a musl C compiler:
# musl-tools on x86_64, zig (scripts/zig-cc) on aarch64.
#
# mimalloc commits whole arenas and purges freed memory only when the
# thread that freed it next allocates, which a sync's idle threads never
# do; main.rs tunes both (`tune_allocator`), for the numbers there.
[target.'cfg(target_env = "musl")'.dependencies]
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", features = ["extended"] }

[[bin]]
name = "autobahn-dash"
path = "src/dash/main.rs"
required-features = ["dash"]
