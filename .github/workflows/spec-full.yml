# The specification at its full bounds: every mode of the star with two
# betas and liveness, three betas under symmetry, and the peering protocol
# in safety and liveness. Half an hour to an hour per configuration on
# eight cores; hours on a runner. So it runs only by hand:
#   gh workflow run spec-full.yml
name: Spec (full)

on:
  workflow_dispatch:

# Read-only, whatever the repository's default says: nothing here writes.
permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: TLC, the release spec/tla2tools.version pins
        # Fetched and checked against the pinned SHA-256; the log names it.
        run: spec/check.sh --fetch
      - name: The star, two betas, every property
        run: spec/check.sh conflict alpha strict
      - name: The star, three betas, invariants
        run: spec/check.sh conflict_n3 alpha_n3 strict_n3
      - name: Peering
        run: spec/check.sh peering_conflict_safety peering_alpha_safety peering_conflict_liveness peering_alpha_liveness
