SPECIFICATION Spec
CONSTANTS
    b1 = b1
    b2 = b2
    Betas = {b1, b2}
    Order <- MCOrder
    Paths <- MCPaths
    Values = {v1, v2}
    NoFile = NoFile
    Dir = Dir
    Mode = "conflict"
    MaxEdits = 1
    MaxFailures = 1
    MaxChanges = 2
    Flaky = TRUE
    Lies = TRUE
    MaxLies = 1
CONSTRAINT GenBound
\* Accounted is left out: a copy that agrees with a host's tree is
\* believed, as a partner editing its own side would be, and can carry a
\* value away without a conflict. What is checked is that a copy that
\* disagrees with a host never costs it a value.
INVARIANTS
    TypeOK
    WellFormed
    NeverDiscards
    Fenced
    DisputedKept
PROPERTIES
    TermsRise
    NoResurrection
CHECK_DEADLOCK FALSE
