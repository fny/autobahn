[package]
name = "autobahn"
version = "0.4.0"
edition = "2021"
description = "Fast, safe, SSH-focused bidirectional file synchronization"
license = "MIT"

[dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
caseless = "0.2"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
libc = "0.2"
lz4_flex = "0.11"
notify = "6"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "1"
toml = "0.8"
unicode-normalization = "0.1"

# The menu bar app, behind a feature so the agent build stays lean.
tray-icon = { version = "0.24", optional = true }
muda = { version = "0.19", optional = true }
winit = { version = "0.30", optional = true }
notify-rust = { version = "4", optional = true }
# The menu bar's ink, for the tray icon: the sign is drawn in the bar's
# own black or white, which a template image cannot do once a coloured
# dot is part of it. Versions already in the tree through tray-icon.
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSApplication", "NSAppearance", "NSResponder"] }

[features]
tray = ["dep:tray-icon", "dep:muda", "dep:winit", "dep:notify-rust", "dep:objc2", "dep:objc2-app-kit"]

[dev-dependencies]
proptest = "1"
tempfile = "3"

[profile.release]
lto = true
