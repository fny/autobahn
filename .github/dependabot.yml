# Weekly update PRs for the crates and for the SHA-pinned actions in
# .github/workflows. Minor and patch updates come as one grouped PR per
# ecosystem; a major update comes on its own, since it may need changes.
# Security advisories are the audit workflow's job (audit.yml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
