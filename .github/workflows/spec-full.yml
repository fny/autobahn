# The specification at its full bounds: every mode of the star with two
# replicas and liveness, three replicas under symmetry, and the p2p protocol
# in safety and liveness. Half an hour to an hour per configuration on
# eight cores; hours on a runner. So it runs only by hand:
#   gh workflow run spec-full.yml
name: Spec (full)

on:
  workflow_dispatch:

# Read-only, whatever the repository's default says: nothing here writes.
permissions:
  contents: read

jobs:
  tlc:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - name: TLC, the release spec/tla2tools.version pins
        # Fetched and checked against the pinned SHA-256; the log names it.
        run: spec/check.sh --fetch
      - name: The star, two replicas, every property
        run: spec/check.sh conflict primary strict
      - name: The star, three replicas, invariants
        run: spec/check.sh conflict_n3 primary_n3 strict_n3
      - name: P2P
        run: spec/check.sh p2p_conflict_safety p2p_primary_safety p2p_conflict_liveness p2p_primary_liveness
