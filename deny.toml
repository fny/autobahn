# cargo-deny's configuration, for `cargo deny check advisories`: run weekly,
# whenever Cargo.lock changes, and by hand, by .github/workflows/audit.yml.
#
# The graph is everything, on every target that ships: `all-features` takes
# the command line and agent, the menu bar app (--features tray), and the
# app (--features app, which brings gpui-kit and its tree). cargo-deny
# cannot say "the tray on macOS only", so it also reads the tray's Linux
# path — GTK, Wayland — which no release carries.
[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

[advisories]
version = 2

# A vulnerability fails the audit wherever it is, at any depth.
#
# An *unmaintained* crate fails only where it is this workspace's own
# choice. The distinction is whether anything can be done: a dependency
# written in Cargo.toml can be replaced, which is how bincode's
# RUSTSEC-2025-0141 was answered — it is postcard now. One buried in
# gpui-kit's tree cannot. Today that is `paste`, `instant` and
# `rustybuzz` under the app, and `ttf-parser` under winit's Wayland
# decorations: four advisories, all unmaintained, none with a safe
# upgrade, none ours to fix. (`proc-macro-error` left with GTK 3, when
# the tray moved to GTK 4 and ksni over glib 0.18's RUSTSEC-2024-0429.)
# They leave when the crates above them update, and an ignore entry
# each would be a hand-kept list of one decision, growing as somebody
# else's tree ages, read by nobody after the third copy.
unmaintained = "workspace"

# Every licence a dependency may carry. A crate offering a choice needs
# only one of its options on this list; a crate offering one needs that
# one. Anything else fails, which is the point: what ships under
# Autobahn's own licence should be a decision, not a default.
#
# All permissive, with two exceptions worth stating.
#
# MPL-2.0 is file-level copyleft: changes to *its* files must be
# published, and linking it carries no obligation to the rest. Neither
# of the two is modified here, and one of them, cbindgen, runs at build
# time and is never linked at all.
#
# Unicode-3.0 covers the Unicode tables several crates embed. It is the
# permissive licence Unicode moved to in 2024.
#
# Nothing here is GPL-only. `self_cell` offers Apache-2.0 OR
# GPL-2.0-only, and Apache-2.0 is the one taken; GPL-2.0-only is absent
# below so the choice cannot be made silently the other way.
[licenses]
version = 2
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "bzip2-1.0.6",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

# Autobahn's own licence, allowed for Autobahn and nothing else.
#
# Not in the list above, deliberately. An AGPL *dependency* would be a
# problem this project cannot absorb: its terms would reach anyone
# building on Autobahn, and no donor's licence granted here could
# release them from it. So the copyleft is allowed exactly where it is
# ours to grant.
[[licenses.exceptions]]
crate = "autobahn"
allow = ["AGPL-3.0-or-later"]

