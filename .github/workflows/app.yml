# Builds the app on a push to main that touches it, so a change that
# breaks the app's build shows up then rather than when a tag is cut:
# ordinary CI tests the app's library code (ci.yml's features-app) but
# does not build its binary. Eight minutes across three runners in
# parallel, so it finishes inside the time CI takes anyway and never
# delays anything. Runner time is free on a public repository.
#
# Nothing here is published. release.yml ships the app on a tag, signed
# and notarised, and that is the one people download. Each build is kept
# as a workflow artifact, for when a build between releases is wanted;
# it is unsigned, so the macOS one needs the quarantine bit cleared
# before it will open:
#
#     xattr -dr com.apple.quarantine "Autobahn.app"
#
# Three platforms, each built natively rather than cross-compiled: GPUI
# links against the system's graphics and font libraries, and a sysroot
# good enough to cross-compile that is more work than a second runner.
# aarch64 Linux runners are free on public repositories.
name: App

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'apps/app/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/app.yml'
  workflow_dispatch:

permissions:
  contents: read

# One build at a time per branch: a newer push makes the older build moot.
concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # The build names the commit it was made from, beside its version.
  AUTOBAHN_COMMIT: ${{ github.sha }}
  # The kit needs a newer compiler than the repository's own pin.
  TOOLCHAIN: '1.98.0'

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      # One platform failing should not hide whether the others work,
      # which is the whole question the first time this runs.
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runs-on: macos-15
          - platform: linux-x86_64
            runs-on: ubuntu-24.04
          - platform: linux-aarch64
            runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Rust
        run: |
          # minimal omits clippy, and the lint step below needs it.
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy
          rustup default "$TOOLCHAIN"

      - uses: Swatinem/rust-cache@v2
        with:
          key: app-${{ matrix.platform }}

      # Two stacks, not one. GPUI wants Vulkan to draw with, xkbcommon and
      # wayland for the window, fontconfig for the text. The menu bar item
      # and the notifications are tray-icon, muda and notify-rust, which on
      # Linux are D-Bus and GTK 4 — libgtk-4-dev is what brings glib, gdk,
      # pango and cairo with it.
      #
      # A tester still needs a Vulkan driver and a display server at run
      # time. That is not this list.
      - name: Libraries the app links against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev \
            libdbus-1-dev \
            libxdo-dev \
            libasound2-dev \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan-dev \
            libxcb-composite0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            pkg-config \
            cmake \
            clang

      # Lints here rather than in ci.yml: ci.yml compiles gpui-kit only to
      # test the library, and a lint there would build it a second time,
      # in clippy's mode, on every push. One platform is enough — the
      # lint is the same on all three, and the other two would only
      # repeat it.
      - name: Lints
        if: matrix.platform == 'linux-x86_64'
        run: cargo clippy --release --locked --all-targets --features app -- -D warnings

      - name: Build
        run: cargo build --release --locked --features app --bin autobahn-app

      - name: Bundle the app
        if: runner.os == 'macOS'
        run: |
          APP="Autobahn.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/autobahn-app "$APP/Contents/MacOS/autobahn-app"
          if xcrun actool assets/Autobahn.icon --compile "$APP/Contents/Resources" \
               --app-icon Autobahn --platform macosx --minimum-deployment-target 11.0 \
               --output-partial-info-plist "$(mktemp)" >/dev/null 2>&1; then
              ICON=Autobahn
          else
              cp assets/autobahn.icns "$APP/Contents/Resources/autobahn.icns"
              ICON=autobahn
          fi
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Autobahn</string>
            <key>CFBundleDisplayName</key><string>Autobahn</string>
            <key>CFBundleIdentifier</key><string>vip.faraz.autobahn</string>
            <key>CFBundleExecutable</key><string>autobahn-app</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleIconFile</key><string>$ICON</string>
            <key>CFBundleIconName</key><string>$ICON</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          # ditto rather than zip, so the bundle's structure survives.
          ditto -c -k --sequesterRsrc --keepParent "$APP" "autobahn-app-${{ matrix.platform }}.zip"

      - name: Stage the Linux build
        if: runner.os == 'Linux'
        # With the packages the binary needs at run time, read off the
        # binary itself, so the list is as true as the build.
        run: |
          mkdir -p stage
          cp target/release/autobahn-app stage/
          sh scripts/apt-requirements.sh target/release/autobahn-app stage/APT_REQUIREMENTS.txt
          cat stage/APT_REQUIREMENTS.txt
          tar -C stage -czf "autobahn-app-${{ matrix.platform }}.tar.gz" .

      - uses: actions/upload-artifact@v7
        with:
          name: autobahn-app-${{ matrix.platform }}
          path: autobahn-app-${{ matrix.platform }}.*
          if-no-files-found: error

